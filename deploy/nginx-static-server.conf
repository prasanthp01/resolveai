# Include in the existing nginx http context after adapting certificate paths.
limit_req_zone $binary_remote_addr zone=resolveai_public:1m rate=5r/s;
server {
    listen 80;
    server_name portfolio.gappazappa.in;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/www-site; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name portfolio.gappazappa.in;
    ssl_certificate /etc/letsencrypt/live/portfolio.gappazappa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.gappazappa.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/www-site/resolveai/current;
    index index.html;
    client_max_body_size 32k;
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    limit_req zone=resolveai_public burst=30 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ { default_type application/json; try_files $uri/index.json =404; }
    location /health/ { default_type application/json; try_files $uri/index.json =404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
