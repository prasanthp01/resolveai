[project]
name = "resolveai"
version = "0.3.7"
description = "Evidence-first incident investigation with a synthetic public demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "argon2-cffi>=23,<26",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "redis>=6,<8",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.11",
    "pip-audit>=2.9",
    "mypy>=1.15",
    "jsonschema==4.26.0",
    "rfc3339-validator==0.1.4",
]
[tool.pytest.ini_options]
pythonpath = [".", "tests/vendor"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
[tool.ruff]
extend-exclude = ["tests/vendor"]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
