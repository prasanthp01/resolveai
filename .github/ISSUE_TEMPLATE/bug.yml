name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Version and safe reproduction steps
      description: Exclude secrets, private logs, and personal data.
    validations:
      required: true
