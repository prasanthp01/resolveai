# Integration handoff: insert only into the existing portfolio HTTPS server.
# Keep the existing root and legacy routes unchanged until the portfolio cutover.
# Connect the edge proxy to resolveai-public-sandbox before activating this block.
# DNS resolution is runtime-based so reloads do not depend on container startup order.
location ^~ /api/projects/resolveai/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $resolveai_upstream resolveai-sandbox-sandbox-1:8000;
    proxy_pass http://$resolveai_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    client_body_timeout 5s;
    add_header Cache-Control "no-store" always;
}
location = /projects/resolveai/app { return 308 /projects/resolveai/app/; }
location ^~ /projects/resolveai/app/ {
    alias /usr/share/nginx/www-site/resolveai-v4/current/;
    try_files $uri $uri/ /projects/resolveai/app/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
# /projects/resolveai belongs to Portfolio. Do not claim it from this app.
# REQUIRED integration change: current vhost has a server-level GET/HEAD-only `if`.
# Move that restriction into its legacy static /api/, /health/ and / locations.
# Otherwise it rejects POST before the sandbox location can process the request.
# Do not merely delete the guard: legacy state-changing routes must stay denied.
