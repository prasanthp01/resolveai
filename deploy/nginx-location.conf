# Include inside the approved portfolio.gappazappa.in HTTPS server block.
# If nginx runs in a container, connect it to a dedicated ResolveAI proxy network
# and use the demo service DNS name instead of this host-loopback example.
location / {
    proxy_pass http://127.0.0.1:8130;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
